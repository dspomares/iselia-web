# Sustituye al default.conf de la imagen nginx:alpine, que no manda ninguna
# cabecera de cache: sin ella Cloudflare pone "max-age=0, must-revalidate" en
# todo, y el visitante que vuelve revalida hasta las fuentes (70 KB) en cada
# carga. Para que estas cabeceras lleguen al navegador, el "Browser Cache TTL"
# de Cloudflare tiene que estar en "Respect Existing Headers".
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # En produccion comprime Cloudflare, pero el contenedor tambien se sirve
  # directo en local y podria ir detras de otro proxy.
  gzip              on;
  gzip_comp_level   6;
  gzip_min_length   1024;
  gzip_vary         on;
  gzip_types        text/css application/javascript image/svg+xml application/json;

  # Por defecto (el HTML incluido): revalidar siempre. Los ficheros no llevan
  # hash en el nombre, asi que el HTML es el unico punto donde un deploy se
  # ve de inmediato.
  add_header Cache-Control "no-cache" always;

  # Las fuentes son subsets variables estables: si se regeneran, cambia el
  # contenido pero tambien tocaria renombrarlas. Son el mejor candidato a TTL
  # largo porque son lo mas pesado de la carga (70 KB entre las dos).
  location ~* \.woff2$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # CSS y JS: sin hash en el nombre, asi que una hora es el techo razonable.
  location ~* \.(css|js)$ {
    add_header Cache-Control "public, max-age=3600" always;
  }

  # Marcas e iconos: los genera brand/build-assets.py con nombre fijo, de modo
  # que un rediseno tarda como mucho un dia en propagarse.
  location ~* \.(svg|png|ico|txt)$ {
    add_header Cache-Control "public, max-age=86400" always;
  }
}
